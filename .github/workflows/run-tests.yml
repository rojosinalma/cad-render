name: run-tests
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }} · ${{ github.actor }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Ruby syntax
        run: ruby -wc app.rb lib/*.rb config.ru

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.23"

      - name: Lockfile is current
        run: uv lock --check

      - name: Python syntax
        run: uv run --frozen --no-dev --no-project python -m py_compile worker/*.py

      - name: Shell
        run: shellcheck -x -e SC2016 bin/cad-render bin/verify bin/entrypoint

      - name: Compose renders
        run: cp .env.example .env && docker compose config -q
