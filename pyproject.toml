[project]
name = "cad-render-worker"
version = "0.1.1"
description = "Python workers for cad-render (build123d / trimesh / manifold3d)"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "trimesh==5.1.1",
    "manifold3d==3.5.4",
    "websockets==17.2",
    "matplotlib==3.11.2",
    "numpy>=2.0",
    "lxml>=5.0",
    "networkx>=3.0",
    "scipy>=1.13",
    "rtree>=1.3",
]

[tool.uv]
package = false
