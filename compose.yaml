---
services:
  cad-render:
    container_name: cad-render
    restart: unless-stopped
    # Prebuilt image from GHCR (x86_64). `docker compose up -d` pulls it; `--build` builds locally.
    image: "ghcr.io/rojosinalma/cad-render:${CAD_IMAGE_TAG:-latest}"
    build: "."
    pull_policy: missing
    # The build123d scripts it runs are arbitrary Python: no Docker socket, no capabilities,
    # read-only rootfs, scratch space only in tmpfs, hard job timeout. ZOO_API_TOKEN comes from
    # /app/.env via dotenv, never from here.
    # user = the host owner of the mounted project, so /app/.env (0600) is readable. Set CAD_UID/CAD_GID
    # in .env (compose reads it for ${...} substitution) when your uid is not 1000.
    user: "${CAD_UID:-1000}:${CAD_GID:-1000}"
    environment:
    - RACK_ENV=development
    - TZ=${TZ:-UTC}
    - HOME=/tmp
    read_only: true
    tmpfs:
    - /tmp:size=2g,uid=${CAD_UID:-1000},gid=${CAD_GID:-1000}
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 4g
    volumes:
    - ".:/app"
    ports:
    - "${CAD_PORT:-9292}:9292"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9292/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
